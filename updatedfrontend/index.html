<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Healthcare Equipment System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="dashboard">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">Overview</div>
          <h1>Dashboard</h1>
          <p>Live status across labs, equipment, and maintenance.</p>
        </div>
        <button class="btn btn-secondary" id="refreshBtn">↻ Refresh</button>
      </div>

      <div class="stat-grid">
        <div class="stat-tile">
          <div class="label"><span class="led led-ok"></span>Available Equipment</div>
          <div class="value" id="statAvailable">—</div>
        </div>
        <div class="stat-tile">
          <div class="label"><span class="led led-warn"></span>Reserved Equipment</div>
          <div class="value" id="statReserved">—</div>
        </div>
        <div class="stat-tile">
          <div class="label"><span class="led led-danger"></span>Under Maintenance</div>
          <div class="value" id="statMaintenance">—</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Equipment per Laboratory</h2></div>
        <div class="table-wrap">
          <table class="data" id="tblEquipmentPerLab">
            <thead><tr><th>Laboratory</th><th>Equipment Count</th></tr></thead>
            <tbody><tr class="loading-row"><td colspan="2">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Reservations per Laboratory</h2></div>
        <div class="table-wrap">
          <table class="data" id="tblReservationsPerLab">
            <thead><tr><th>Laboratory</th><th>Reservation Count</th></tr></thead>
            <tbody><tr class="loading-row"><td colspan="2">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

  <script src="js/app.js"></script>
</body>
</html>
