<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laboratory Staff · Healthcare Equipment System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="staff">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">People</div>
          <h1>Laboratory Staff</h1>
          <p>People who can reserve and manage equipment.</p>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ Add staff member</button>
      </div>

      <div class="toolbar">
        <input type="text" id="filterDept" placeholder="Filter by department…" />
        <button class="btn btn-secondary btn-sm" id="btnFilter">Search</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="filterActiveOnly" style="width:auto;" /> Active only
        </label>
        <button class="btn btn-secondary btn-sm" id="btnClearFilter">Clear</button>
        <div class="spacer"></div>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="staffRows">
              <tr class="loading-row"><td colspan="6">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="staffModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="staffModalTitle">Add staff member</h3>
        <button class="modal-close" data-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="staffForm">
          <input type="hidden" id="staffId" />
          <div class="field">
            <label for="staffName">Name</label>
            <input type="text" id="staffName" required />
          </div>
          <div class="field">
            <label for="staffUsername">Username</label>
            <input type="text" id="staffUsername" required />
          </div>
          <div class="field">
            <label for="staffPassword">Password</label>
            <input type="password" id="staffPassword" required />
        </div>
          <div class="field-row">
            <div class="field">
              <label for="staffEmail">Email</label>
              <input type="email" id="staffEmail" />
            </div>
            <div class="field">
              <label for="staffPhone">Phone</label>
              <input type="text" id="staffPhone" />
            </div>
          </div>
          <div class="field">
            <label for="staffDept">Department</label>
            <input type="text" id="staffDept" />
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close>Cancel</button>
        <button class="btn btn-primary" id="staffSaveBtn">Save staff member</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
