<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equipment · Healthcare Equipment System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="equipment">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">Inventory</div>
          <h1>Equipment</h1>
          <p>Every instrument tracked across all laboratories.</p>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ Add equipment</button>
      </div>

      <div class="toolbar">
        <select id="filterAvailable">
          <option value="all">All equipment</option>
          <option value="available">Available only</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="filterActiveOnly" style="width:auto;" /> Active only
        </label>
        <div class="spacer"></div>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Name</th>
                <th>Serial No.</th>
                <th>Laboratory</th>
                <th>Purchased</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="equipRows">
              <tr class="loading-row"><td colspan="6">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal-overlay" id="equipModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="equipModalTitle">Add equipment</h3>
        <button class="modal-close" data-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="equipForm">
          <input type="hidden" id="equipId" />
          <div class="field">
            <label for="equipName">Name</label>
            <input type="text" id="equipName" required />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="equipSerial">Serial number</label>
              <input type="text" id="equipSerial" />
            </div>
            <div class="field">
              <label for="equipPurchaseDate">Purchase date</label>
              <input type="date" id="equipPurchaseDate" />
            </div>
          </div>
          <div class="field">
            <label for="equipLab">Laboratory</label>
            <select id="equipLab"></select>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close>Cancel</button>
        <button class="btn btn-primary" id="equipSaveBtn">Save equipment</button>
      </div>
    </div>
  </div>

  <!-- Status change modal -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Change status</h3>
        <button class="modal-close" data-close-status>&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="statusEquipId" />
        <div class="field">
          <label for="statusSelect">New status</label>
          <select id="statusSelect">
            <option value="Available">Available</option>
            <option value="Reserved">Reserved</option>
            <option value="Maintenance">Under maintenance</option>
          </select>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close-status>Cancel</button>
        <button class="btn btn-primary" id="statusSaveBtn">Update status</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
