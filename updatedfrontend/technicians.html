<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Technicians · Healthcare Equipment System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="technicians">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">Service</div>
          <h1>Maintenance Technicians</h1>
          <p>Who repairs and services equipment.</p>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ Add technician</button>
      </div>

      <div class="toolbar">
        <input type="text" id="filterSpec" placeholder="Filter by specialization…" />
        <button class="btn btn-secondary btn-sm" id="btnFilter">Search</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="filterActiveOnly" style="width:auto;" /> Active only
        </label>
        <button class="btn btn-secondary btn-sm" id="btnClearFilter">Clear</button>
        <div class="spacer"></div>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Specialization</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="techRows">
              <tr class="loading-row"><td colspan="5">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="techModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="techModalTitle">Add technician</h3>
        <button class="modal-close" data-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="techForm">
          <input type="hidden" id="techId" />
          <div class="field">
            <label for="techName">Name</label>
            <input type="text" id="techName" required />
          </div>
          <div class="field">
            <label for="techUsername">Username</label>
            <input type="text" id="techUsername" required />
        </div>
        <div class="field">
          <label for="techPassword">Password</label>
          <input type="password" id="techPassword" required />
      </div>
          <div class="field-row">
            <div class="field">
              <label for="techPhone">Phone</label>
              <input type="text" id="techPhone" />
            </div>
            <div class="field">
              <label for="techSpec">Specialization</label>
              <input type="text" id="techSpec" />
            </div>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close>Cancel</button>
        <button class="btn btn-primary" id="techSaveBtn">Save technician</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
