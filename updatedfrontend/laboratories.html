<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laboratories · Healthcare Equipment System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="laboratories">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">Facilities</div>
          <h1>Laboratories</h1>
          <p>Rooms and facilities that hold equipment.</p>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ Add laboratory</button>
      </div>

      <div class="toolbar">
        <input type="text" id="filterLocation" placeholder="Filter by location…" />
        <button class="btn btn-secondary btn-sm" id="btnFilter">Search</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" id="filterActiveOnly" style="width:auto;" /> Active only
        </label>
        <button class="btn btn-secondary btn-sm" id="btnClearFilter">Clear</button>
        <div class="spacer"></div>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Name</th>
                <th>Location</th>
                <th>Description</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="labRows">
              <tr class="loading-row"><td colspan="5">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal-overlay" id="labModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="labModalTitle">Add laboratory</h3>
        <button class="modal-close" data-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="labForm">
          <input type="hidden" id="labId" />
          <div class="field">
            <label for="labName">Name</label>
            <input type="text" id="labName" required />
          </div>
          <div class="field">
            <label for="labLocation">Location</label>
            <input type="text" id="labLocation" required />
          </div>
          <div class="field">
            <label for="labDescription">Description</label>
            <textarea id="labDescription" rows="3"></textarea>
          </div>
          <div class="field">
            <label style="display:flex; align-items:center; gap:8px; font-weight:500;">
              <input type="checkbox" id="labActive" style="width:auto;" checked />
              Active
            </label>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close>Cancel</button>
        <button class="btn btn-primary" id="labSaveBtn">Save laboratory</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
