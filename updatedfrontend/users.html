<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Users · Healthcare Equipment System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="users">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">Access control</div>
          <h1>Manage Users</h1>
          <p>Create sign-in accounts for admins, lab staff, and technicians. Nobody can register themselves — only an admin can create an account here.</p>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ Register user</button>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Username</th>
                <th>Role</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="userRows">
              <tr class="loading-row"><td colspan="3">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Register modal -->
  <div class="modal-overlay" id="userModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Register user</h3>
        <button class="modal-close" data-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="userForm">
          <div class="field">
            <label for="userUsername">Username</label>
            <input type="text" id="userUsername" autocomplete="off" required />
          </div>
          <div class="field">
            <label for="userPassword">Temporary password</label>
            <input type="password" id="userPassword" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="userRole">Role</label>
            <select id="userRole">
              <option value="ADMIN">Admin</option>
              <option value="LAB_STAFF">Lab staff</option>
              <option value="TECHNICIAN">Technician</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close>Cancel</button>
        <button class="btn btn-primary" id="userSaveBtn">Create account</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
