<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maintenance · Healthcare Equipment System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="maintenance">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">Service</div>
          <h1>Maintenance</h1>
          <p>Repair and servicing work orders.</p>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ New work order</button>
      </div>

      <div class="toolbar">
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="btnClearFilter">Clear</button>
        <div class="spacer"></div>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Date</th>
                <th>Equipment</th>
                <th>Technician</th>
                <th>Description</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="maintRows">
              <tr class="loading-row"><td colspan="6">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="maintModal">
    <div class="modal">
      <div class="modal-head">
        <h3>New work order</h3>
        <button class="modal-close" data-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="maintForm">
          <div class="field">
            <label for="maintEquip">Equipment</label>
            <select id="maintEquip" required></select>
          </div>
          <div class="field">
            <label for="maintTech">Technician</label>
            <select id="maintTech" required></select>
          </div>
          <div class="field">
            <label for="maintDate">Date</label>
            <input type="date" id="maintDate" required />
          </div>
          <div class="field">
            <label for="maintDesc">Description</label>
            <textarea id="maintDesc" rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close>Cancel</button>
        <button class="btn btn-primary" id="maintSaveBtn">Create work order</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
